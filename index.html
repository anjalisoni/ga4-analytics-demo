<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Analytics Tracking Demo</title>

  <!-- Google Tag Manager -->
  <script>(function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':
  new Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],
  j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';j.async=true;j.src=
  'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);
  })(window,document,'script','dataLayer','GTM-W42ZX4QZ');</script>

<body style="font-family: Arial, sans-serif; padding: 40px; text-align: center;">

  <!-- Google Tag Manager (noscript) -->

  height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
  <!-- End Google Tag Manager (noscript) -->

  <h1>GA4 & GTM Event Tracking Demo</h1>
  <p>Click the buttons below to fire custom events to Google Analytics 4.</p>
  
  <button id="btn-lead" style="padding: 12px 24px; font-size: 16px; margin: 10px; cursor: pointer; background-color: #007bff; color: white; border: none; border-radius: 4px;">Generate Lead</button>
  <button id="btn-promo" style="padding: 12px 24px; font-size: 16px; margin: 10px; cursor: pointer; background-color: #28a745; color: white; border: none; border-radius: 4px;">Click Promo Banner</button>

  <script>
    document.getElementById('btn-lead').addEventListener('click', function() {
      window.dataLayer = window.dataLayer || [];
      window.dataLayer.push({
        'event': 'custom_lead_submit',
        'lead_type': 'demo_request',
        'button_location': 'hero_section'
      });
    });

    document.getElementById('btn-promo').addEventListener('click', function() {
      window.dataLayer = window.dataLayer || [];
      window.dataLayer.push({
        'event': 'custom_promo_click',
        'promo_name': 'summer_discount',
        'button_location': 'body_banner'
      });
    });
  </script>
</body>
</html>
